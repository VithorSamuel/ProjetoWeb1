<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='cadastro.css'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
     integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" 
     crossorigin="anonymous">


</head>
<body>
    <div class="container container-fluid min-vh-100 min-vw-100 d-flex flex-column">
        <div class="row flex-grow-1">
            <main class="col-md-6">
                <h1>Cadastre-se</h1>
            </main>
            <aside class="col-md-6">
                <form id="form-cadastro">

                    <div class="campos">
                        <h2>Inscreva-se em Sicherheit</h2>
                    <label for="email">Email</label>
                    <input name="email" id="inputEmail" type="email"
                     placeholder="Email" class="inputcadastro">
                    </div>

                    <div class="campos">
                    <label for="senha">Senha</label>
                    <input name="senha" id="inputSenha" type="password"
                     placeholder="Senha" class="inputcadastro">
                    </div>

                    <div class="campos">
                    <label for="nome">Nome</label>
                    <input name="nome" id="inputNome" type="text" 
                     placeholder="Nome" class="inputcadastro">
                    <input id="btncadastrar" type="submit" value="cadastrar" id="btncadastrar">
                    </div>
                </form>
            </aside>
        </div>
          
        </div>
    </div>

<script src="/cadastro.js"></script>

<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
 integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
 integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
 crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" 
integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</body>
</html>
